// Firebase SDK がロードされるのを待って初期化
function initFirebase() {
  if (typeof firebase !== 'undefined' && !firebaseReady) {
    try {
      firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      database = firebase.database();
      auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch((error) => {
        console.warn('Auth persistence error:', error);
      });
      auth.onAuthStateChanged(handleAuthState);
      firebaseReady = true;
      console.log('Firebase initialized');
    } catch (e) {
      console.error('Firebase初期化エラー:', e);
    }
  }
}

// Firebase SDKがロードされるまでポーリング
function waitForFirebase() {
  let attempts = 0;
  const maxAttempts = 20;
  
  const checkFirebase = () => {
    attempts++;
    if (typeof firebase !== 'undefined' && firebase.apps && firebase.apps.length > 0) {
      initFirebase();
    } else if (attempts < maxAttempts) {
      setTimeout(checkFirebase, 300);
    }
  };
  
  checkFirebase();
}

// ページ読み込み後にFirebaseを初期化
window.addEventListener('load', waitForFirebase);

let currentUser = null;
let isLoggedIn = false;

function handleAuthState(user) {
  if (user) {
    currentUser = user;
    isLoggedIn = true;
    onLoginStateChanged();
    loadUserDataFromFirebase();
  } else {
    currentUser = null;
    isLoggedIn = false;
    onLogoutStateChanged();
    loadUserData();
  }
}

// ===== 表示切替 =====
function setView(mode) {
  if (!window.currentView) window.currentView = 'mobile';

  if (window.currentView === mode) return;

  window.currentView = mode;

  const app = document.getElementById('app');
  const btnMobile = document.getElementById('btn-mobile');
  const btnPc = document.getElementById('btn-pc');

  if (mode === 'pc') {
    app.classList.remove('max-w-md');
    app.classList.add('max-w-4xl');

    btnPc.classList.remove('bg-gray-500');
    btnPc.classList.add('bg-blue-500');

    btnMobile.classList.remove('bg-blue-500');
    btnMobile.classList.add('bg-gray-500');

  } else {
    app.classList.remove('max-w-4xl');
    app.classList.add('max-w-md');

    btnMobile.classList.remove('bg-gray-500');
    btnMobile.classList.add('bg-blue-500');

    btnPc.classList.remove('bg-blue-500');
    btnPc.classList.add('bg-gray-500');
  }
}

// ===== Local Storage =====

let lastDeleted = null;

function isMobileViewport() {
  const isNarrow = window.matchMedia('(max-width: 768px)').matches;
  const ua = navigator.userAgent || '';
  const isMobileUserAgent = /Android|webOS|iPhone|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
  const isTouchDevice = navigator.maxTouchPoints > 1 || typeof window.orientation !== 'undefined';
  const isDesktopLike = /Windows|Macintosh|Linux/.test(navigator.platform);
  return isNarrow || (isMobileUserAgent && !isDesktopLike) || (isTouchDevice && !isDesktopLike);
}

function setInputEnabled(enabled){
  document.getElementById('input-block').style.display =
    enabled ? 'block' : 'none';

  inputOpen = enabled;
}

function updateInputView() {
  const isPC = !isMobileViewport();

  setInputEnabled(isPC);

  setView(isPC ? 'pc' : 'mobile');
}

window.onload = () => {
  populateYearSelects();
  setView(isMobileViewport() ? 'mobile' : 'pc');
  updateInputView();
  onLogoutStateChanged();

  if (firebaseReady && auth) {
    handleAuthState(auth.currentUser);
  } else {
    loadUserData();
  }

  window.addEventListener('resize', updateInputView);
  window.addEventListener('orientationchange', updateInputView);

  const mediaQuery = window.matchMedia('(max-width: 768px)');
  if (typeof mediaQuery.addEventListener === 'function') {
    mediaQuery.addEventListener('change', updateInputView);
  } else if (typeof mediaQuery.addListener === 'function') {
    mediaQuery.addListener(updateInputView);
  }

  document.getElementById('item').addEventListener('change', () => {
    const id = Number(document.getElementById('item').value);
    if (!id) return;

    document.getElementById('date').disabled = false;
    document.getElementById('addBtn').disabled = false;
    document.getElementById('unit').disabled = false;
    document.getElementById('unit-minus').disabled = false;
    document.getElementById('unit-plus').disabled = false;

    const unit = calcUnit(id, 1);

      countGroup.classList.remove('hidden');
      countInput.disabled = false;
      countInput.value = 0;
    } else {
      countGroup.classList.add('hidden');
      countInput.disabled = true;
      countInput.value = '';
    }
  });
};

    userRef.set({
      records: records,

    });

function loadUserDataFromFirebase() {
  if (!isLoggedIn || !currentUser || !firebaseReady || !database) return;

  const userRef = database.ref('users/' + currentUser.uid);
  userRef.on('value', (snapshot) => {
    const data = snapshot.val();
    if (data) {
      records = data.records || [];
      meta = data.meta || {};
      selectedSpecialties = data.selectedSpecialties || [];
      
      document.querySelectorAll('#specialty-block input').forEach(el => {
        el.checked = selectedSpecialties.includes(el.value);
      });

      loadMetaToUI();
      renderSpecialtySelect();
      filterItems();
      render();
    } else {
      // 新しいユーザー：空データで初期化
      records = [];
      meta = {};
      selectedSpecialties = [];
      loadMetaToUI();
      renderSpecialtySelect();
      filterItems();
      render();
    }
  });
}

function loadUserData(){
  records = JSON.parse(localStorage.getItem('records') || '[]');
  meta = JSON.parse(localStorage.getItem('meta') || '{}');
  selectedSpecialties = JSON.parse(localStorage.getItem('selectedSpecialties') || '[]');

  document.querySelectorAll('#specialty-block input').forEach(el => {
    el.checked = selectedSpecialties.includes(el.value);
  });

  const updatedAt = localStorage.getItem('updatedAt');
  if (updatedAt) {
    const d = new Date(updatedAt);
    const el = document.getElementById('updatedAt');
    if (el) {
      el.innerText = `最終更新: ${d.toLocaleString()}`;
    }
  }
  loadMetaToUI();
  renderSpecialtySelect();
  filterItems();
  render();
}

// ===== Google ログイン =====
function loginWithGoogle() {
  // Firebaseがまだ準備できていない場合は再試行
  if (!firebaseReady) {
    initFirebase();
    // 少し待って再試行
    setTimeout(() => {
      if (firebaseReady && auth) {
        doGoogleLogin();
      } else {
        alert('認証システムがまだロードされていません。しばらくしてから再度お試しください。');
      }
    }, 1000);
    return;
  }

  doGoogleLogin();
}

function doGoogleLogin() {
  if (!auth) {
    alert('認証システムが利用できません。');
    return;
  }

  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider)
    .then((result) => {
      currentUser = result.user;
      isLoggedIn = true;
      onLoginStateChanged();
      loadUserDataFromFirebase();
    })
    .catch((error) => {
      console.error('ログインエラー:', error);
      alert('ログインに失敗しました: ' + error.message);
    });
}

function logoutUser() {
  if (confirm('ログアウトしますか？')) {
    if (firebaseReady && auth) {
      auth.signOut()
        .then(() => {
          currentUser = null;
          isLoggedIn = false;
          onLogoutStateChanged();
          records = [];
          meta = {};
          selectedSpecialties = [];
          render();
        })
        .catch((error) => {
          console.error('ログアウトエラー:', error);
        });
    }
  }
}

// ===== 単位 =====
function calcUnit(id, val) {
  const i = items[id];
  if (i.type === 'fixed') return i.unit;
  if (i.type === 'count') return 0;
  return Math.round(val * i.unit * 10) / 10;
}

function adjustUnit(delta) {
  const unitInput = document.getElementById('unit');
  let currentValue = parseFloat(unitInput.value) || 0;
  currentValue += delta;
  
  // 0未満にならないようにする
  if (currentValue < 0) currentValue = 0;
  
  unitInput.value = currentValue;
}

// ===== 判定 =====
function judge(sp) {

const rec = records.filter(r => {
  if (r.specialty === sp) return true;

  if (items[r.item].sp === '共通講習') {
    return judgeValidForSP(r, sp); 
  }

  return false;
});

  let total = rec.reduce((s, x) => s + x.unit, 0);
  let msg = [];

  // 共通講習で○印がついたものを各科単位数に加算
  const commonRecords = records.filter(r => items[r.item].sp === '共通講習');
  commonRecords.forEach(r => {
    if (judgeValidForSP(r, sp)) {
      total += r.unit;
    }
  });

  if (sp === '小児科') {
    const cases = rec.filter(r => r.item === 201).reduce((s, x) => s + x.value, 0);
    const lecture = rec.filter(r => r.item === 202).reduce((s, x) => s + x.unit, 0);

    if (cases >= 100) total += 10;
    if (cases < 100) msg.push(`症例あと${100 - cases}`);
    if (lecture < 20) msg.push(`領域講習あと${20 - lecture}`);
    if (total < 50) msg.push(`単位あと${(50 - total).toFixed(1)}`);
  }

  if (sp === '総合診療') {
    const mp = rec.filter(r => r.item === 101).reduce((s, x) => s + x.value, 0);
    if (mp < 14) msg.push(`ミニポートフォリオあと${14 - mp}`);
    if (total < 50) msg.push(`単位あと${(50 - total).toFixed(1)}`);
  }

  if (sp === '総合内科') {
    const ids = rec.map(r => r.item);
    if (![401, 402, 403].some(x => ids.includes(x))) msg.push("必須講演不足");
    if (!ids.includes(404)) msg.push("セルフトレ不足");
    if (total < 75) msg.push(`単位あと${(75 - total).toFixed(1)}`);
  }

  return { total, msg };
}

function isInPeriod(date, start, end) {
  if (!date || !start || !end) return false;

  const d = new Date(date);
  const s = new Date(start);
  const e = new Date(end);

  return d >= s && d <= e;
}

function judgeValidForSP(record, sp) {
  const m = meta[sp];
  if (!m?.start || !m?.end) return false;

  if (!record.date) return true;

  return isInPeriod(record.date, m.start, m.end);
}

function addRecord() {

  const id = Number(document.getElementById('item').value);
  const unit = Number(document.getElementById('unit').value);
  const date = document.getElementById('date').value;
  const sp = document.getElementById('input-specialty').value;

  if (!id || !sp) return;

  // 病例数の場合はvalueに入力を使用
  let value = 1;
  const countInput = document.getElementById('count-value');
  if (countInput && countInput.style.display !== 'none') {
    value = Number(countInput.value) || 0;
  }

  const isCommon = items[id].sp === '共通講習';

  if (isCommon) {
    const index = records.findIndex(r => r.item === id && r.specialty === sp);

    if (index >= 0) {
      records[index] = {
        item: id,
        specialty: sp,
        value: 1, // ←固定
        unit,
        date
      };
    } else {
      records.push({
        item: id,
        specialty: sp,
        value: value,
        unit,
        date
      });
    }

  } else {
    records.push({
      item: id,
      specialty: sp,
      value: value,
      unit,
      date
    });
  }

  // リセット
  document.getElementById('date').value = '';
  document.getElementById('item').value = '';
  document.getElementById('unit').value = '';

  // 入力ロック
  document.getElementById('date').disabled = true;
  document.getElementById('addBtn').disabled = true;
  document.getElementById('unit').disabled = true;
  document.getElementById('unit-minus').disabled = true;
  document.getElementById('unit-plus').disabled = true;

  saveAll();
  render();
}

function addCommonRecord() {
  const id = Number(document.getElementById('common-item').value);
  const date = document.getElementById('common-date').value;

  if (!id || !date) {
    alert('項目と日付を選択してください');
    return;
  }

  const item = items[id];
  const index = records.findIndex(r => r.item === id);

  if (index >= 0) {
    // 既存の共通講習は上書き
    records[index] = {
      item: id,
      specialty: null,
      value: 1,
      unit: item.unit,
      date
    };
  } else {
    // 新規追加
    records.push({
      item: id,
      specialty: null,
      value: 1,
      unit: item.unit,
      date
    });
  }

  // リセット
  document.getElementById('common-item').value = '';
  document.getElementById('common-date').value = '';

  saveAll();
  render();
}

function showUndo() {

function undoDelete() {
  if (!lastDeleted) return;

  records.splice(lastDeleted.index, 0, lastDeleted.record);

  saveAll();
  render();

  document.getElementById('undoBox').classList.add('hidden');
  lastDeleted = null;
}

function generateYearOptions(startYear, endYear) {
  let options = '';
  for (let y = startYear; y <= endYear; y++) {
    options += `<option value="${y}">${y}</option>`;
  }
  return options;
}

function generateMonthOptions() {
  let options = '';
  for (let m = 1; m <= 12; m++) {
    const padded = m.toString().padStart(2, '0');
    options += `<option value="${padded}">${m}</option>`;
  }
  return options;
}

function populateYearSelects() {
  const currentYear = new Date().getFullYear();
  const startYears = generateYearOptions(currentYear - 7, currentYear);
  const examYears = generateYearOptions(currentYear, currentYear + 10);
  const months = generateMonthOptions();

  document.querySelectorAll('[data-key="startYear"]').forEach(el => {
    el.innerHTML = '<option value="">年</option>' + startYears;
  });
  document.querySelectorAll('[data-key="endYear"]').forEach(el => {
    el.innerHTML = '<option value="">年</option>' + startYears;
  });
  document.querySelectorAll('[data-key="startMonth"]').forEach(el => {
    el.innerHTML = '<option value="">月</option>' + months;
  });
  document.querySelectorAll('[data-key="endMonth"]').forEach(el => {
    el.innerHTML = '<option value="">月</option>' + months;
  });
  document.querySelectorAll('[data-key="exam"]').forEach(el => {
    el.innerHTML = '<option value="">年度</option>' + examYears;
  });
}

function updateMeta(sp, key) {
  const yearEl = document.querySelector(`[data-sp="${sp}"][data-key="${key}Year"]`);
  const monthEl = document.querySelector(`[data-sp="${sp}"][data-key="${key}Month"]`);
  if (yearEl && monthEl && yearEl.value && monthEl.value) {
    const value = `${yearEl.value}-${monthEl.value}`;
    saveMeta(sp, key, value);
  }
}

function loadMetaToUI() {
  document.querySelectorAll('#specialty-block [data-sp]').forEach(el => {
    const sp = el.dataset.sp;
    const key = el.dataset.key;
    if (meta[sp]) {
      if (key === 'startYear' && meta[sp].start) {
        el.value = meta[sp].start.split('-')[0];
      } else if (key === 'startMonth' && meta[sp].start) {
        el.value = meta[sp].start.split('-')[1];
      } else if (key === 'endYear' && meta[sp].end) {
        el.value = meta[sp].end.split('-')[0];
      } else if (key === 'endMonth' && meta[sp].end) {
        el.value = meta[sp].end.split('-')[1];
      } else if (key === 'exam') {
        el.value = meta[sp].exam || '';
      }
    }
  });
}
